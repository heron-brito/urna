name: Build APK

# Gera o APK do Quiz Gospel do Milhão.
# Os runners do GitHub têm acesso ao Android SDK e ao Google Maven
# (dl.google.com), então o build Android roda sem problemas aqui.

on:
  push:
    branches:
      - claude/gospel-quiz-flutter-app-lojax3
      - main
    tags:
      - 'v*' # ex.: v1.0.0 -> cria um Release com o APK anexado
  workflow_dispatch: # permite rodar manualmente pela aba Actions
    inputs:
      release_tag:
        description: 'Se preenchido (ex.: v1.0.0), cria um Release com o APK anexado'
        required: false
        default: ''
  release:
    types: [published] # ao publicar um release, anexa o APK

permissions:
  contents: write # necessário para criar o Release e anexar o APK

jobs:
  build-apk:
    name: Build Android APK
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: 3.44.2
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Analyze
        run: flutter analyze

      - name: Run tests
        run: flutter test

      - name: Build release APK
        run: flutter build apk --release

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: quiz-gospel-do-milhao-apk
          path: build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: error

      - name: Publish APK to release
        # roda ao: publicar um release; dar push numa tag v*; ou disparar
        # manualmente informando um release_tag (cria a tag + o release).
        if: >-
          github.event_name == 'release' ||
          startsWith(github.ref, 'refs/tags/v') ||
          (github.event_name == 'workflow_dispatch' && inputs.release_tag != '')
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ inputs.release_tag || github.ref_name }}
          name: Quiz Gospel do Milhão ${{ inputs.release_tag || github.ref_name }}
          generate_release_notes: true
          files: build/app/outputs/flutter-apk/app-release.apk
